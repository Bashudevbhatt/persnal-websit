```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to My Website</title>

    <style>
        /* Page background */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            color: #333;
            text-align: center;
        }

        /* Main welcome box */
        .welcome-box {
            max-width: 800px;
            margin: 100px auto;
            padding: 50px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* Heading */
        h1 {
            font-size: 45px;
            color: #1565c0;
            margin-bottom: 15px;
        }

        /* Subtitle */
        p {
            font-size: 20px;
            line-height: 1.6;
            color: #555;
        }

        /* Button */
        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 17px;
            transition: 0.3s;
        }

        /* Button hover effect */
        .button:hover {
            background: #0d47a1;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>Welcome!</h1>

        <p>
            Welcome to my website.
            <br>
            I am glad to have you here.
        </p>

        <p>
            Explore the website and discover more.
        </p>

        <a href="#" class="button">Explore More</a>

        <footer>
            © 2026 My Website. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
```
